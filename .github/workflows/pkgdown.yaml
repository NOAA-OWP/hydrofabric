name: pkgdown

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system deps (GEOS / GDAL / PROJ / units)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libproj-dev libgeos-dev libsqlite3-dev \
            libudunits2-dev libcurl4-openssl-dev libssl-dev libxml2-dev libv8-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(install = FALSE, new_process = FALSE)'

      # _pkgdown.yml sets destination: pkgdown_site (keeps Quarto's docs/ clean).
      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pkgdown_site
          clean: true
